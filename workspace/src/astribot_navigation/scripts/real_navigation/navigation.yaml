# Navigation limits; no acceptance-document startup gates.
max_speed: 0.3
sdk_root: /home/astribot/astribot_sdk_aarch64
base_from_lidar:
  - [0.696665, 0.717397, 0.0, 0.17393]
  - [-0.717397, 0.696665, 0.0, 0.16893]
  - [0.0, 0.0, 1.0, 0.054]
  - [0.0, 0.0, 0.0, 1.0]
imu_from_lidar:
  - [1.0, 0.0, 0.0, -0.011]
  - [0.0, 1.0, 0.0, -0.02329]
  - [0.0, 0.0, 1.0, 0.04412]
  - [0.0, 0.0, 0.0, 1.0]
rear_origin_in_front: [0.001, -0.496, 0.084]
# Include the previously user-confirmed fixed-posture body projection.
footprint: [[0.50, 0.40], [0.50, -0.40], [-0.40, -0.40], [-0.40, 0.40]]
# User-confirmed robot body envelope in base XY, at every height.
# Confirmed extent: forward 0.50 m, rearward 0.40 m, left/right 0.40 m.
self_filter: [[-0.40, -0.40], [0.50, -0.40], [0.50, 0.40], [-0.40, 0.40]]
# Relaxed for tight spaces (user request 2026-11-05): 0.05 -> 0.02 m, 1.0 -> 0.5 m.
footprint_padding: 0.02
inflation_radius: 0.75
collision_time_horizon: 1.5
# AMCL scan source. lio_body: FAST-LIO's deskewed body cloud, published with
# its pose (no pose wait). raw_pair: previous per-lidar Python deskew path.
# Per-lidar obstacle clouds for retreat checks are produced in both modes.
scan_input: lio_body
# Nominal observed floor z per input in chassis coordinates, used as a fit prior.
# Back/forward returns have a small relative vertical offset on S1B.
ground_z_in_base: {front: -0.11, back: -0.13}
# Reproduce the original map's front-lidar-height slice relative to local ground.
ground_slice_height: 0.164
slice_height: 0.054  # historical fixed-origin configs
slice_thickness: 0.10
obstacle_min_height: 0.02
obstacle_max_height: 2.0
feedback_timeout: 0.15
# Target lead budget (raised 2026-11-05 so the chassis can track 0.3 m/s / 0.3 rad/s).
# On executor/link failure the chassis may still travel up to this lead.
max_position_error: 0.25
max_yaw_error: 0.20

# Validated by isolated real-AMCL stationary/turning A/B; no zero-threshold resampling.
amcl_update_min_d: 0.05
amcl_update_min_a: 0.05
